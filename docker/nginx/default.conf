# Laravel 用の Nginx 設定。public/ をドキュメントルートにする。
# Nginx config for Laravel; document root is the public/ directory.
server {
    # __PORT__ は起動時に entrypoint が実際のポート番号へ置換する。
    # __PORT__ is replaced with the real port number by the entrypoint at start-up.
    # Railway などの PaaS は待ち受けポートを $PORT で動的に割り当てるため。
    # PaaS platforms such as Railway assign the listening port dynamically via $PORT.
    listen __PORT__ default_server;
    server_name _;
    root /var/www/html/public;

    index index.php;

    charset utf-8;

    # フロントコントローラーパターン: 実ファイルが無ければ index.php に渡す。
    # Front-controller pattern: fall back to index.php when no real file matches.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP リクエストを php-fpm に渡す。
    # Pass PHP requests to php-fpm.
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 隠しファイル（.env など）へのアクセスを拒否する。
    # Deny access to hidden files such as .env.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
