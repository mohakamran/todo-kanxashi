; supervisor で nginx と php-fpm を同一コンテナ内で管理する。
; Use supervisor to run nginx and php-fpm together in one container.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

; php-fpm: PHP アプリケーションを処理する。
; php-fpm: processes the PHP application.
[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; nginx: 静的ファイルの配信と PHP へのプロキシを行う。
; nginx: serves static files and proxies to PHP.
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
